<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation cluster memory</title>
<link rel="stylesheet" href="design-system/tokens.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* Made for a 16:9 video that is watched on a phone, where the frame shrinks to a fifth.
     So: few elements, large type. Every slide is laid out on a fixed 1920x1080 stage that is
     scaled to fit the window; all sizes below are in stage pixels. */
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--mg-bg); }
  body { font-family: var(--mg-font); color: var(--mg-ink); }

  .stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* Slide frame and caption */
  .slide { width: 100%; height: 100%; box-sizing: border-box; padding: 64px 96px; display: flex; flex-direction: column; gap: 40px; }
  .head { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mg-accent); }
  .title { margin: 0; font-size: 88px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
  .title.small { font-size: 80px; }
  .sub { margin: 6px 0 0; font-size: 34px; color: var(--mg-muted); }
  .body { flex-grow: 1; display: flex; gap: 56px; min-height: 0; }
  svg { display: block; flex-shrink: 0; }

  /* Context window */
  .window { flex-grow: 1; min-width: 0; border: 2px solid var(--mg-line); border-radius: 28px; padding: 28px 36px; display: flex; flex-direction: column; gap: 18px; background: var(--mg-panel); }
  .window.rows { gap: 14px; }
  .window-head { display: flex; align-items: center; gap: 20px; }
  .window-head.ruled { padding-bottom: 10px; border-bottom: 2px solid var(--mg-line); }
  .window-label { font-size: 24px; font-weight: 500; color: var(--mg-muted); }
  .chip-sys { font-family: var(--mg-mono); font-size: 22px; color: var(--mg-bg); background: var(--mg-muted); border-radius: 8px; padding: 4px 12px; }

  /* Slide 1: whole turns */
  .turn { display: grid; grid-template-columns: 150px minmax(0, 1fr); column-gap: 24px; padding-top: 6px; border-top: 2px solid var(--mg-line); }
  .turn-num { font-family: var(--mg-mono); font-size: 22px; font-weight: 600; color: var(--mg-accent); padding-top: 18px; }
  .turn-msgs { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 16px; }
  .msg { display: flex; align-items: baseline; gap: 20px; }
  .role { width: 120px; flex-shrink: 0; font-family: var(--mg-mono); font-size: 22px; color: var(--mg-muted); }
  .role.you { color: var(--mg-accent); }
  .text { font-size: 36px; }
  .text.you { font-weight: 500; }
  .lookup { margin-left: 140px; align-self: flex-start; display: flex; align-items: center; gap: 18px; background: var(--mg-panel-raised); border-radius: 14px; padding: 10px 20px; font-size: 30px; color: var(--mg-lookup-text); }
  .lookup svg { width: 30px; height: 30px; color: var(--mg-lookup); }
  .lookup .then { color: var(--mg-faint); }

  /* Fill meter */
  .meter { width: 300px; flex-shrink: 0; display: flex; gap: 28px; }
  .meter-track { position: relative; width: 44px; border-radius: 22px; background: var(--mg-track); border: 2px solid var(--mg-line); overflow: hidden; }
  .meter-fill { position: absolute; inset: 0; background: var(--mg-accent); border-radius: 20px; transform-origin: center bottom; }
  .meter-text { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding-bottom: 4px; }
  .meter-was { font-size: 26px; color: var(--mg-muted); }
  .meter-nums { position: relative; height: 124px; }
  .meter-num { position: absolute; left: 0; bottom: 0; font-size: 136px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.9; color: var(--mg-accent); }
  .meter-caption { font-size: 30px; color: var(--mg-muted); }

  /* Slides 2 and 6: one row per turn */
  .row { display: flex; align-items: center; gap: 24px; min-height: 46px; }
  .row-num { width: 110px; flex-shrink: 0; font-family: var(--mg-mono); font-size: 22px; font-weight: 600; color: var(--mg-accent); }
  .row-q { min-width: 0; font-size: 30px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.old .row-num { color: var(--mg-faint); }
  .row.old .row-q { color: var(--mg-soft); }
  .tag { flex-shrink: 0; display: flex; align-items: center; gap: 10px; background: var(--mg-panel-raised); border-radius: 10px; padding: 4px 14px; font-size: 22px; color: var(--mg-lookup-text); white-space: nowrap; }
  .tag svg { width: 20px; height: 20px; color: var(--mg-lookup); }
  .row.compact { min-height: 36px; gap: 18px; }
  .row.compact .row-num { width: 100px; font-size: 20px; }
  .row.compact .row-q { font-size: 26px; }
  .row.compact .tag { gap: 8px; padding: 3px 12px; font-size: 19px; }
  .row.compact .tag svg { width: 18px; height: 18px; }

  /* Slides 3 and 4: cost per question */
  .chart { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  .chart-label { font-family: var(--mg-mono); font-size: 24px; font-weight: 600; color: var(--mg-muted); }
  .plot { position: relative; flex-grow: 1; min-height: 0; display: flex; align-items: flex-end; gap: 32px; border-bottom: 3px solid var(--mg-line-strong); }
  .plot.dense { gap: 22px; }
  .col { flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 12px; }
  .bar { width: 100%; background: var(--mg-bar); border-radius: 10px 10px 0 0; }
  .bar.first { background: var(--mg-soft); }
  .bar.hot { background: var(--mg-accent); }
  .bar.next { background: var(--mg-bar-strong); }
  .bar.full { background: var(--mg-danger); }
  .bar-label { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--mg-soft); }
  .bar-label.big { font-size: 72px; color: var(--mg-accent); }
  .axis { display: flex; justify-content: space-between; align-items: baseline; font-size: 32px; font-weight: 500; }
  .axis .later { color: var(--mg-muted); }
  .limit { position: absolute; left: 0; right: 0; bottom: 90%; border-top: 3px dashed var(--mg-danger); }
  .limit-label { position: absolute; left: 0; bottom: calc(90% + 12px); font-family: var(--mg-mono); font-size: 24px; font-weight: 600; color: var(--mg-danger); }

  .ask { width: 520px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .ask-label { font-family: var(--mg-mono); font-size: 24px; font-weight: 600; color: var(--mg-accent); }
  .ask-q { margin: 0; font-size: 60px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .error { align-self: flex-start; display: flex; align-items: center; gap: 18px; border: 3px solid var(--mg-danger); border-radius: 18px; padding: 20px 26px; font-size: 36px; font-weight: 700; color: var(--mg-danger); }
  .error svg { width: 36px; height: 36px; }
  .error.small { padding: 16px 22px; font-size: 30px; }
  .error.small svg { width: 30px; height: 30px; }

  /* Slide 5: today versus one way to solve it */
  .today { width: 700px; flex-shrink: 0; box-sizing: border-box; background: var(--mg-danger-ground); border: 2px solid var(--mg-danger-line); border-radius: 28px; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
  .today-label { font-family: var(--mg-mono); font-size: 26px; font-weight: 600; color: var(--mg-danger-text); }
  .today-mid { display: flex; flex-direction: column; gap: 22px; }
  .today-q { margin: 0; font-size: 40px; font-weight: 500; color: var(--mg-body); }
  .statement { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; }
  .pointer { display: flex; align-items: center; color: var(--mg-faint); }
  .pointer svg { width: 56px; height: 56px; }
  .ideas { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px; padding: 16px 0; }
  .ideas-label { font-family: var(--mg-mono); font-size: 26px; font-weight: 600; color: var(--mg-accent); }
  .idea { display: flex; align-items: flex-start; gap: 32px; }
  .idea-num { width: 72px; flex-shrink: 0; font-size: 80px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.9; color: var(--mg-accent); }
  .idea-text { display: flex; flex-direction: column; gap: 6px; }
  .idea-title { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .idea-sub { font-size: 28px; color: var(--mg-muted); }

  /* Slide 6: archive and current conversation */
  .archive { width: 540px; flex-shrink: 0; box-sizing: border-box; background: var(--mg-archive); border: 3px dashed var(--mg-line-strong); border-radius: 28px; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; }
  .zone-head { display: flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 700; }
  .zone-head svg { width: 34px; height: 34px; color: var(--mg-soft); }
  .zone-sub { margin-top: -6px; font-size: 26px; color: var(--mg-muted); }
  .topic { border: 2px solid var(--mg-line); background: var(--mg-panel); border-radius: 20px; padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
  .topic-name { font-size: 34px; font-weight: 700; }
  .topic-items { font-size: 24px; color: var(--mg-soft); }
  .hit { background: var(--mg-accent-soft); border: 2px solid var(--mg-accent); border-radius: 12px; padding: 8px 14px; font-size: 26px; font-weight: 600; }
  .bridge { width: 170px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .bridge-label { font-family: var(--mg-mono); font-size: 22px; font-weight: 600; color: var(--mg-accent); }
  .bridge svg { width: 130px; height: 40px; color: var(--mg-accent); }
  .bridge-sub { font-size: 22px; color: var(--mg-muted); }
  .window.convo { padding: 24px 32px; gap: 10px; }
  .convo-title { font-size: 30px; font-weight: 700; }
  .found { margin-top: 6px; display: flex; align-items: center; gap: 14px; background: var(--mg-accent-soft); border: 2px solid var(--mg-accent); border-radius: 14px; padding: 10px 18px; font-size: 28px; font-weight: 600; }
  .found svg { width: 26px; height: 26px; color: var(--mg-accent); }
  .exchange { margin-top: auto; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid var(--mg-line); padding-top: 14px; }
  .exchange .msg { gap: 18px; }
  .exchange .role { width: 100px; font-size: 20px; }
  .exchange .text { font-size: 32px; }
  .exchange .text.you { font-weight: 600; }

  /* Controls: hidden with H while recording */
  #progress { position: absolute; left: 0; bottom: 0; height: 0.6vh; background: var(--mg-accent); transition: width 0.4s ease; }
  .controls { position: absolute; right: 2vw; bottom: 1.5vh; display: flex; align-items: center; gap: 16px; font-size: 15px; color: var(--mg-muted); }
  .controls[hidden] { display: none; }
  .btn { font: inherit; color: var(--mg-accent); background: transparent; border: 1px solid var(--mg-line-strong); border-radius: 8px; padding: 4px 14px; cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--mg-accent); }
  .btn:focus-visible { outline: 1px solid var(--mg-accent); outline-offset: 2px; }
  .btn:disabled { color: var(--mg-faint); cursor: default; }
  .indicator { color: var(--mg-ink); font-variant-numeric: tabular-nums; }
  .ticks { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .ticks li { width: 16px; height: 2px; background: var(--mg-line-strong); }
  .ticks li.on { background: var(--mg-accent); }

  /* Animations: every one runs once and holds its end state. No timers, no loops. */
  .anim {
    animation-duration: var(--dur, 600ms);
    animation-delay: var(--d, 0ms);
    animation-fill-mode: both;
    animation-iteration-count: 1;
    animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .a-fade { animation-name: fade; }
  .a-rise { animation-name: rise; }
  .a-pop { animation-name: pop; transform-origin: center; }
  .a-grow { animation-name: grow; transform-origin: left center; }
  .a-grow-up { animation-name: grow-up; transform-origin: center bottom; --dur: 500ms; }
  .a-light { animation-name: light; --dur: 700ms; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.4); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes grow-up { from { transform: scaleY(0); } }
  @keyframes light { from { background: var(--mg-panel-raised); border-color: var(--mg-panel-raised); } }

  @media (prefers-reduced-motion: reduce) {
    .anim { animation-duration: 1ms !important; animation-delay: 0ms !important; }
  }
</style>
</head>
<body>
<main class="surface">
  <div class="stage"></div>
  <p class="sr-only" id="step-title" aria-live="polite"></p>
  <div id="progress"></div>
  <nav class="controls" aria-label="Steps">
    <button class="btn" type="button" data-dir="-1">Back</button>
    <span class="indicator" data-testid="step-indicator"></span>
    <ol class="ticks" aria-hidden="true"></ol>
    <button class="btn" type="button" data-dir="1">Next</button>
    <span>← → space · H hides</span>
  </nav>
</main>

<script>
"use strict";

const stage = document.querySelector(".stage");
const liveTitle = document.getElementById("step-title");
const controls = document.querySelector(".controls");
const indicator = document.querySelector(".indicator");
const ticks = document.querySelector(".ticks");
const [backButton, nextButton] = controls.querySelectorAll(".btn");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- small builders ---------- */

function h(parent, tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  parent.appendChild(el);
  return el;
}

// Give an element a one-shot animation, with a delay in ms and optional custom properties.
function anim(el, name, delay = 0, vars = {}) {
  el.classList.add("anim", "a-" + name);
  el.style.setProperty("--d", delay + "ms");
  for (const [key, value] of Object.entries(vars)) el.style.setProperty("--" + key, value);
  return el;
}

// Line icons; they take their colour from the CSS `color` of their parent.
const ICONS = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>',
  ticket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/></svg>',
  cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
  long: '<svg viewBox="0 0 130 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20h112M98 6l20 14-20 14"/></svg>',
  archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>',
};

function icon(parent, name) {
  parent.insertAdjacentHTML("beforeend", ICONS[name]);
  return parent.lastElementChild;
}

const pad = (i) => String(i).padStart(2, "0");

/* ---------- shared pieces ---------- */

function caption(slide, step) {
  const head = h(slide, "header", "head");
  anim(h(head, "p", "eyebrow", "HeadingFWD · " + step.section), "rise", 0);
  anim(h(head, "h1", step.small ? "title small" : "title", step.title), "rise", 80);
  if (step.sub) anim(h(head, "p", "sub", step.sub), "rise", 160);
}

function windowPanel(parent, cls = "window", ruled = false) {
  const win = h(parent, "section", cls);
  const head = h(win, "div", ruled ? "window-head ruled" : "window-head");
  h(head, "span", "window-label", "Context window");
  h(head, "span", "chip-sys", "System prompt");
  return win;
}

// Fill meter beside the window. steps: [[ms, percent], ...]; the first is the start.
function meter(parent, steps, was) {
  const T = steps[steps.length - 1][0] + 300;
  const duration = REDUCED ? 1 : T;
  const box = h(parent, "aside", "meter");
  const fill = h(h(box, "div", "meter-track"), "div", "meter-fill");
  const frames = [{ transform: `scaleY(${steps[0][1] / 100})`, offset: 0 }];
  for (let k = 1; k < steps.length; k++) {
    frames.push({ transform: `scaleY(${steps[k - 1][1] / 100})`, offset: steps[k][0] / T });
    frames.push({ transform: `scaleY(${steps[k][1] / 100})`, offset: (steps[k][0] + 250) / T });
  }
  frames.push({ transform: `scaleY(${steps[steps.length - 1][1] / 100})`, offset: 1 });
  fill.animate(frames, { duration, fill: "both" });

  const text = h(box, "div", "meter-text");
  if (was !== undefined) anim(h(text, "span", "meter-was", `was ${was}%`), "fade", T - 300);
  const nums = h(text, "div", "meter-nums");
  steps.forEach(([t, pct], k) => {
    const label = h(nums, "span", "meter-num", pct + "%");
    const last = k === steps.length - 1;
    const f = [{ opacity: k === 0 ? 1 : 0, offset: 0 }];
    if (k > 0) f.push({ opacity: 0, offset: t / T }, { opacity: 1, offset: (t + 1) / T });
    if (!last) f.push({ opacity: 1, offset: steps[k + 1][0] / T }, { opacity: 0, offset: (steps[k + 1][0] + 1) / T });
    f.push({ opacity: last ? 1 : 0, offset: 1 });
    label.animate(f, { duration, fill: "both" });
  });
  h(text, "span", "meter-caption", "of the window");
}

// One turn as a row: its number, the user's question, and what the AI looked up for it.
function turnRow(parent, n, question, lookup, cls = "row") {
  const row = h(parent, "div", cls);
  h(row, "span", "row-num", "Turn " + n);
  h(row, "span", "row-q", question);
  if (lookup) {
    const tag = h(row, "span", "tag");
    icon(tag, "search");
    tag.append(lookup);
  }
  return row;
}

/* ---------- the conversation ---------- */

// Turns 1-3 in full: what the user says, what the AI looks up, what it answers.
const FULL_TURNS = [
  [
    ["you", "What time does flight XY123 to Ibiza leave?"],
    ["lookup", "search", "Looks up the flight", "11:45, gate D7"],
    ["ai", "It leaves at 11:45 from gate D7."],
  ],
  [
    ["you", "Book me a seat on it."],
    ["lookup", "ticket", "Books the seat", "reference K7Q2"],
    ["ai", "Booked. Your reference is K7Q2."],
  ],
  [
    ["you", "Thanks!"],
    ["ai", "Have a good trip!"],
  ],
];

// Turns 1-10 as rows, and the turns 11-20 that follow them.
const FIRST_TEN = [
  ["What time does flight XY123 to Ibiza leave?", "looks up the flight"],
  ["Book me a seat on it.", "books the seat"],
  ["Thanks!", ""],
  ["Is there a lounge near gate D7?", "looks up the airport"],
  ["What will the weather be in Ibiza?", "checks the forecast"],
  ["Find a hotel near the beach.", "searches hotels"],
  ["Book the second one.", "books the hotel"],
  ["Add breakfast, please.", "changes the booking"],
  ["When can I check in?", ""],
  ["Rent a car for three days.", "searches car rentals"],
];

const NEXT_TEN = [
  ["Which beaches are quiet in May?", "searches beaches"],
  ["How far is Cala Comte from the hotel?", "checks the map"],
  ["Book a table for dinner on Friday.", "books the table"],
  ["Is that place good for vegetarians?", "reads reviews"],
  ["Great, thanks.", ""],
  ["What should I pack?", ""],
  ["Do I need a power adapter?", ""],
  ["Find a boat trip to Formentera.", "searches trips"],
  ["Book two seats on the morning one.", "books the trip"],
  ["When do I need to be at the port?", "checks the ticket"],
];

// Window fill after each question; the cost of a question follows it.
const FILL_BY_TURN = [16, 21, 25, 29, 34, 38, 43, 47, 52, 56, 61, 65, 70];

/* ---------- the scenes ---------- */

function sceneTurns(slide) {
  const body = h(slide, "div", "body");
  const win = anim(windowPanel(body), "fade", 0);
  const fill = [12, 16, 21, 25];
  const steps = [[0, 0], [500, fill[0]]];
  let delay = 600;
  FULL_TURNS.forEach((messages, t) => {
    const turn = anim(h(win, "div", "turn"), "fade", delay);
    h(turn, "span", "turn-num", "Turn " + (t + 1));
    const list = h(turn, "div", "turn-msgs");
    delay += 150;
    for (const message of messages) {
      if (message[0] === "lookup") {
        const [, kind, action, result] = message;
        const row = anim(h(list, "div", "lookup"), "rise", delay);
        icon(row, kind);
        h(row, "span", "", action);
        h(row, "span", "then", "→");
        h(row, "span", "", result);
      } else {
        const [who, content] = message;
        const row = anim(h(list, "div", "msg"), "rise", delay);
        h(row, "span", who === "you" ? "role you" : "role", who === "you" ? "You" : "AI");
        h(row, "span", who === "you" ? "text you" : "text", content);
      }
      delay += 220;
    }
    steps.push([delay, fill[t + 1]]);
    delay += 300;
  });
  meter(body, steps);
}

function sceneFill(slide) {
  const body = h(slide, "div", "body");
  const win = windowPanel(body, "window rows", true);
  const steps = [[0, 25]];
  FIRST_TEN.forEach(([question, lookup], i) => {
    if (i < 3) {
      turnRow(win, i + 1, question, lookup, "row old");
      return;
    }
    const delay = 300 + (i - 3) * 320;
    anim(turnRow(win, i + 1, question, lookup), "rise", delay);
    steps.push([delay + 150, FILL_BY_TURN[i]]);
  });
  meter(body, steps, 25);
}

function sceneCost(slide) {
  const chart = h(slide, "section", "chart");
  h(chart, "span", "chart-label", "Cost per question");
  const plot = h(chart, "div", "plot");
  const max = FILL_BY_TURN[FILL_BY_TURN.length - 1];
  const last = FILL_BY_TURN.length - 1;
  FILL_BY_TURN.forEach((value, i) => {
    const col = h(plot, "div", "col");
    const delay = 200 + i * 150;
    if (i === 0) anim(h(col, "span", "bar-label", "1×"), "fade", delay + 300);
    if (i === last) anim(h(col, "span", "bar-label big", "4×"), "pop", delay + 500);
    const bar = h(col, "div", i === 0 ? "bar first" : i === last ? "bar hot" : "bar");
    bar.style.height = Math.round((value / max) * 82) + "%";
    anim(bar, "grow-up", delay);
  });
  const axis = h(chart, "div", "axis");
  h(axis, "span", "", "Question 1");
  h(axis, "span", "later", "later questions →");
}

// The chart of step 3 goes on until one large lookup hits the limit.
function sceneFull(slide) {
  const body = h(slide, "div", "body");
  body.style.gap = "64px";
  const chart = h(body, "section", "chart");
  h(chart, "span", "chart-label", "Cost per question");
  const plot = h(chart, "div", "plot dense");
  h(plot, "div", "limit");
  const values = [...FILL_BY_TURN, 74, 100];
  const last = values.length - 1;
  values.forEach((value, i) => {
    const col = h(plot, "div", "col");
    const bar = h(col, "div", i === last ? "bar full" : i === last - 1 ? "bar next" : "bar");
    bar.style.height = Math.round(value * 0.9) + "%";
    if (i === last - 1) anim(bar, "grow-up", 300);
    if (i === last) anim(bar, "grow-up", 1000, { dur: "800ms" });
  });
  anim(h(plot, "span", "limit-label", "Window full"), "pop", 1800);
  const axis = h(chart, "div", "axis");
  h(axis, "span", "", "Question 1");
  h(axis, "span", "later", "later questions →");

  const ask = h(body, "aside", "ask");
  anim(h(ask, "span", "ask-label", "New question"), "rise", 2300);
  anim(h(ask, "p", "ask-q", "“What time does my flight leave?”"), "rise", 2400);
  const error = anim(h(ask, "div", "error"), "rise", 3100);
  icon(error, "cross");
  h(error, "span", "", "No room for an answer");
}

const IDEAS = [
  ["Keep the newest turns", "The last ten stay as they are."],
  ["Summarise older turns", "Older talk becomes short notes per topic."],
  ["Look up what is needed", "Details come back only when a question asks for them."],
];

function sceneFix(slide) {
  const body = h(slide, "div", "body");
  body.style.gap = "40px";
  const today = anim(h(body, "section", "today"), "rise", 0);
  h(today, "span", "today-label", "Today");
  const mid = h(today, "div", "today-mid");
  h(mid, "p", "today-q", "“What time does my flight leave?”");
  const error = h(mid, "div", "error small");
  icon(error, "cross");
  h(error, "span", "", "No room for an answer");
  anim(h(today, "p", "statement", "A user should never see this."), "rise", 700);

  icon(anim(h(body, "div", "pointer"), "fade", 1500), "arrow");

  const ideas = h(body, "section", "ideas");
  anim(h(ideas, "span", "ideas-label", "One way to solve it"), "fade", 1800);
  IDEAS.forEach(([title, sub], k) => {
    const idea = anim(h(ideas, "div", "idea"), "rise", 2100 + k * 450);
    h(idea, "span", "idea-num", String(k + 1));
    const text = h(idea, "div", "idea-text");
    h(text, "span", "idea-title", title);
    h(text, "span", "idea-sub", sub);
  });
}

const TOPICS = [
  ["Flight", "Flight XY123 to Ibiza · lounge"],
  ["Hotel", "Beach hotel · booking · breakfast"],
  ["Car and weather", "Forecast · car for three days"],
];

// Old turns sit in the archive by topic; a question brings back only the part it needs.
function sceneArchive(slide) {
  const body = h(slide, "div", "body");
  body.style.gap = "0";

  const archive = anim(h(body, "section", "archive"), "fade", 0);
  const head = h(archive, "div", "zone-head");
  icon(head, "archive");
  h(head, "span", "", "Archive");
  h(archive, "span", "zone-sub", "Turns 1–10, stored by topic");
  let hit;
  TOPICS.forEach(([name, items], k) => {
    const topic = anim(h(archive, "div", "topic"), "rise", 200 + k * 150);
    h(topic, "span", "topic-name", name);
    h(topic, "span", "topic-items", items);
    if (k === 0) hit = h(topic, "div", "hit", "Booked · reference K7Q2");
  });

  const bridge = h(body, "div", "bridge");
  anim(h(bridge, "span", "bridge-label", "brought in"), "fade", 2300);
  anim(icon(bridge, "long"), "grow", 2300);
  anim(h(bridge, "span", "bridge-sub", "only what the question needs"), "fade", 2500);

  const convo = anim(h(body, "section", "window convo"), "fade", 0);
  const convoHead = h(convo, "div", "window-head ruled");
  h(convoHead, "span", "convo-title", "Current conversation");
  h(convoHead, "span", "chip-sys", "System prompt");
  NEXT_TEN.forEach(([question, lookup], i) => turnRow(convo, 11 + i, question, lookup, "row compact"));
  const found = anim(h(convo, "div", "found"), "rise", 2800);
  icon(found, "archive");
  h(found, "span", "", "From the archive: reference K7Q2");
  const exchange = h(convo, "div", "exchange");
  const question = anim(h(exchange, "div", "msg"), "rise", 1000);
  h(question, "span", "role you", "Turn 21");
  h(question, "span", "text you", "Do you remember my booking reference?");
  const answer = anim(h(exchange, "div", "msg"), "rise", 3400);
  h(answer, "span", "role", "AI");
  h(answer, "span", "text", "Yes, it is K7Q2, for flight XY123.");

  // The matching part of the archive lights up before it moves over.
  anim(hit, "light", 1800);
}

/* ---------- steps ---------- */

const STEPS = [
  { section: "The problem", title: "Messages form turns", scene: sceneTurns },
  { section: "The problem", title: "Every turn fills the window", scene: sceneFill },
  { section: "The problem", title: "Each question costs more", sub: "Every question sends the whole conversation again.", scene: sceneCost },
  { section: "The problem", title: "A full window cannot answer", sub: "One large lookup takes the last of the space.", scene: sceneFull },
  { section: "The fix", title: "A common problem for AI assistants", sub: "And there are many ways to solve it.", scene: sceneFix },
  { section: "Remembering", title: "New turns stay, old ones go to the archive", small: true, scene: sceneArchive },
];

let current = 0;

function show(index) {
  current = Math.max(0, Math.min(STEPS.length - 1, index));
  const step = STEPS[current];
  stage.replaceChildren();
  const slide = h(stage, "div", "slide");
  caption(slide, step);
  step.scene(slide);
  liveTitle.textContent = step.title;
  indicator.textContent = pad(current + 1) + " / " + pad(STEPS.length);
  document.getElementById("progress").style.width = ((current + 1) / STEPS.length) * 100 + "%";
  [...ticks.children].forEach((li, i) => li.classList.toggle("on", i === current));
  backButton.disabled = current === 0;
  nextButton.disabled = current === STEPS.length - 1;
}

// Scale the 1920x1080 stage to fit the window.
function fit() {
  stage.style.setProperty("--s", Math.min(innerWidth / 1920, innerHeight / 1080));
}

for (let i = 0; i < STEPS.length; i++) h(ticks, "li");

controls.addEventListener("click", (event) => {
  const button = event.target.closest(".btn");
  if (button) show(current + Number(button.dataset.dir));
});

const KEYS = {
  ArrowRight: 1, ArrowDown: 1, PageDown: 1, " ": 1,
  ArrowLeft: -1, ArrowUp: -1, PageUp: -1,
};

document.addEventListener("keydown", (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === "h" || event.key === "H") {
    controls.hidden = !controls.hidden;
    return;
  }
  const dir = KEYS[event.key];
  if (dir === undefined) return;
  // Also stops Space and arrows from activating a focused button a second time.
  event.preventDefault();
  if (!event.repeat) show(current + dir);
});

addEventListener("resize", fit);
fit();
show(0);
</script>
</body>
</html>
